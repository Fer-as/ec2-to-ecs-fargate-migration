# Nginx reverse proxy configuration for legacy Flask app
# This runs on the EC2 instance and proxies to the Flask app on port 5000

upstream flask_app {
    server 127.0.0.1:5000;
    keepalive 32;
}

server {
    listen 80;
    server_name _;
    server_tokens off;

    # Logging
    access_log /var/log/nginx/flask-access.log;
    error_log /var/log/nginx/flask-error.log warn;

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;

    # Client body size
    client_max_body_size 1M;

    # Timeouts
    proxy_connect_timeout 60s;
    proxy_send_timeout 60s;
    proxy_read_timeout 60s;

    # Proxy settings. These are inherited by every location below, as long as a
    # location does not set its own proxy_set_header (that would replace them all).
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Connection "";
    proxy_http_version 1.1;

    # Health check endpoint (not written to the access log)
    location /health {
        access_log off;
        proxy_pass http://flask_app;
    }

    # API endpoints
    location /api/ {
        proxy_pass http://flask_app;
    }

    # Root endpoint
    location / {
        proxy_pass http://flask_app;
    }
}
